name: trello
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # Utilities
  archive: ^3.6.1
  uuid: ^3.0.5
  intl: ^0.17.0
  crypto: ^3.0.3

  # UI
  flutter_datetime_picker_plus: ^2.1.0
  animate_do: ^2.1.0
  flutter_beautiful_popup: ^1.7.0
  panara_dialogs: ^0.1.2
  lottie: ^3.3.0
  ftoast: ^2.0.0
  flutter_slider_drawer: ^2.1.1

  # State management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.5

  # Local storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Fonts & icons
  google_fonts: ^6.2.1
  font_awesome_flutter: ^10.12.0

  # Launcher icon
  flutter_launcher_icons: 0.11.0

  modal_progress_hud_nsn: ^0.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/lottie/1.json

flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/logo_icon.png"